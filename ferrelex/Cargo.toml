[package]
name = "ferrelex"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
documentation.workspace = true
homepage.workspace = true
description = "Write lexers using familiar Rust match syntax — patterns are compiled at build time"
keywords = ["lexer", "lexical-analysis", "procedural-macro", "parsing"]
categories = ["parsing", "text-processing", "development-tools::procedural-macro-helpers"]

[dependencies]
ferrelex_core = { path = "../ferrelex_core", version = "0.2.2" }
ferrelex_macro = { path = "../ferrelex_macro", version = "0.2.2" }

[dev-dependencies]
macrotest = "1"
trybuild = { version = "1", features = ["diff"] }
