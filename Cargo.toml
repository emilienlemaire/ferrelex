[workspace]
members = [
  "ferrelex",
  "ferrelex_core",
  "ferrelex_macro",
  "ferrelex_gen",
]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "LGPL-3.0-only"
readme = "README.md"
repository = "https://github.com/emilienlemaire/ferrelex"
documentation = "https://docs.rs/ferrelex"
homepage = "https://github.com/emilienlemaire/ferrelex"

[profile.bench]
debug = true
