[package]
name = "ferrelex_macro"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = [ "full", "extra-traits" ] }
ferrelex_core = { path = "../ferrelex_core" }
rustc-hash = "2.1.1"

[dev-dependencies]
trybuild = "1"
macrotest = "1"
